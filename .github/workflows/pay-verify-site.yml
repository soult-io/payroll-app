name: pay-verify-site

# Spec 17 chunk B (PAY-44): build + publish the static pay-verify QA dashboard
# image ghcr.io/soult-io/payroll-app-verify from the verify-summary history.
#
# It never runs tests. It ingests the summary.json that ci.yml / e2e-nightly.yml
# already publish (chunk A), keeps a rolling window of them on the orphan
# `pay-verify-data` branch, generates the static site from that history, and
# builds a digest-pinned nginx image. Deploy + the LAN/VPN gate are chunk D.
#
# Triggers: after ci (on main) or the nightly finishes (workflow_run), plus a
# manual re-generate (workflow_dispatch, no new ingest). Fork-gated on the repo.
#
# Same-commit publishing (spec 20, PAY-78). Under workflow_run, github.sha is
# main's tip when THIS run starts, not the commit the triggering run tested. So
# the checkout, the image tag and the ingested summary are all bound to
# workflow_run.head_sha (COMMIT_SHA), re-checked against the API, and asserted
# equal before anything is pushed. :latest moves only while that commit is
# still main's tip. Unlike ta-verify, a FAILED triggering run still publishes:
# showing failures is this dashboard's job.
#
# Gotcha: `gh run list` shows main's tip as headSha for workflow_run runs. The
# "tag sha-X | checkout X | evidence X" log line is the record of the real
# bound commit.

on:
  workflow_run:
    workflows: [ci, e2e-nightly, walkthrough]
    types: [completed]
    # head_branch only — the job's `if` still checks the event and repository.
    branches: [main]
  workflow_dispatch:

# Jobs grant their own permissions; nothing is inherited.
permissions: {}

# Serialize: concurrent runs would race on the pay-verify-data branch push.
# Concurrency applies BEFORE the job's `if`, and a run joining the group
# cancels a run still pending in it. So a run that is going to be skipped (a
# failed or pull_request run, a failed walkthrough) gets a group of its own:
# it must never cancel a waiting run that would publish. Every publishing run
# shares `pay-verify-site-publish` (a non-empty key: in an expression '' is
# falsy and would send every run to the skip branch). Keep in step with the
# job's `if`.
concurrency:
  group: >-
    pay-verify-site-${{
      (github.event_name == 'workflow_dispatch' || (
        github.event.workflow_run.conclusion != 'cancelled' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        (
          (github.event.workflow_run.name != 'walkthrough' &&
            contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event.workflow_run.event)) ||
          (github.event.workflow_run.name == 'walkthrough' &&
            github.event.workflow_run.event == 'workflow_run' &&
            github.event.workflow_run.conclusion == 'success')
        )
      )) && 'publish' || format('skip-{0}', github.run_id)
    }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/soult-io/payroll-app-verify
  DATA_BRANCH: pay-verify-data
  # Spec 20 D1: journey media lives on its own orphan branch, force-pushed as
  # ONE commit holding only the latest ci bundle — binary history never piles
  # up (the text-only data branch keeps its history).
  ASSETS_BRANCH: pay-verify-assets
  HISTORY_KEEP: "60"
  # The commit this run builds from: the triggering run's tested commit, else
  # the dispatched ref's own commit.
  COMMIT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  build:
    # Only the real repo, and (for workflow_run) only runs of this repo's main
    # from a push, the nightly cron or a manual dispatch. A pull_request run
    # never feeds the site, including a fork PR from a branch named "main"
    # (head_branch alone matches that). workflow_dispatch always allowed.
    # A CANCELLED run (ci cancels superseded runs on main) tested nothing, so it
    # publishes nothing: no sha-* tag without a result behind it.
    # Keep in step with the API re-check in "Resolve triggering run".
    #
    # A walkthrough run (spec 20 PR 7) counts only when it succeeded and was
    # itself started by workflow_run — i.e. it re-recorded a green ci push to
    # main. Its PR and manual recordings never feed the site.
    if: >-
      github.repository == 'soult-io/payroll-app' &&
      (github.event_name == 'workflow_dispatch' || (
        github.event.workflow_run.conclusion != 'cancelled' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        (
          (github.event.workflow_run.name != 'walkthrough' &&
            contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event.workflow_run.event)) ||
          (github.event.workflow_run.name == 'walkthrough' &&
            github.event.workflow_run.event == 'workflow_run' &&
            github.event.workflow_run.conclusion == 'success')
        )
      ))
    runs-on: ubuntu-latest
    permissions:
      contents: write # push to the pay-verify-data branch
      packages: write # push the image to GHCR
      actions: read # download the triggering run's artifact
    steps:
      # Re-read the triggering run from the API and confirm everything the
      # publish relies on, including the attempt (a re-run started since would
      # swap in its artifacts). Loud: nothing publishes rather than the wrong
      # commit's evidence.
      - name: Resolve triggering run
        if: github.event_name == 'workflow_run'
        uses: actions/github-script@v7
        with:
          script: |
            const t = context.payload.workflow_run;
            const { data: run } = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: t.id,
            });
            const workflows = [
              ".github/workflows/ci.yml",
              ".github/workflows/e2e-nightly.yml",
              ".github/workflows/walkthrough.yml",
            ];
            const isWalkthrough = run.path.startsWith(".github/workflows/walkthrough.yml");
            const events = isWalkthrough ? ["workflow_run"] : ["push", "schedule", "workflow_dispatch"];
            const problems = [
              !workflows.some((w) => run.path === w || run.path.startsWith(`${w}@`)) && `path ${run.path}`,
              !events.includes(run.event) && `event ${run.event}`,
              isWalkthrough && run.conclusion !== "success" && `conclusion ${run.conclusion}`,
              run.head_branch !== "main" && `head_branch ${run.head_branch}`,
              run.head_repository?.full_name !== `${context.repo.owner}/${context.repo.repo}` &&
                `head_repository ${run.head_repository?.full_name}`,
              run.head_sha !== process.env.COMMIT_SHA && `head_sha ${run.head_sha} != ${process.env.COMMIT_SHA}`,
              run.run_attempt !== t.run_attempt && `run_attempt ${run.run_attempt} != ${t.run_attempt}`,
            ].filter(Boolean);
            if (problems.length) {
              core.setFailed(`run ${t.id} is not usable evidence: ${problems.join("; ")}`);
              return;
            }
            core.info(`bound to ${run.path} run ${run.id} attempt ${run.run_attempt} @ ${run.head_sha}`);

      # The tested commit: the generator, Dockerfile and nginx.conf come from it.
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.COMMIT_SHA }}

      - uses: pnpm/action-setup@v6
        with:
          version: 11.17.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build verify-site (+ its schema dep)
        run: pnpm --filter @payroll/verify-summary --filter @payroll/verify-site run build

      # Pull the summary + html report the triggering run published (chunk A).
      # ci → pay-verify-summary; nightly → pay-verify-summary-nightly.
      - name: Download summary artifact
        if: github.event_name == 'workflow_run' && github.event.workflow_run.name != 'walkthrough'
        # Tolerate a missing artifact: a skipped/queued nightly (self-hosted
        # qa-e2e runner asleep) or an expired artifact legitimately has none.
        # The Ingest step warns and rebuilds the site from existing history.
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: ${{ github.event.workflow_run.name == 'e2e-nightly' && 'pay-verify-summary-nightly' || 'pay-verify-summary' }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: _incoming

      # Spec 20: the ci run's journey evidence (json + step stills). ci only —
      # the nightly never captures (D2). Tolerated when absent (an older run,
      # an expired artifact): the cards then say "no evidence for this run".
      - name: Download journey evidence
        if: github.event_name == 'workflow_run' && github.event.workflow_run.name == 'ci'
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: pay-verify-evidence
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: _evidence_in

      # Spec 20 PR 7: the walkthrough run's recording (json + one webm per
      # journey). Tolerated when absent: nothing is then published.
      - name: Download walkthrough
        if: github.event_name == 'workflow_run' && github.event.workflow_run.name == 'walkthrough'
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: pay-verify-walkthrough
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: _walkthrough_in

      # Last gate before any push: the tag commit, the checked-out tree and the
      # ingested summary's commit must all be the same. A missing summary (the
      # tolerated skipped/expired case above) ingests nothing, so there is no
      # evidence leg to check and it logs "evidence none".
      - name: Assert same-commit evidence
        run: |
          head="$(git rev-parse HEAD)"
          evidence=none
          if [ -f _incoming/summary.json ]; then
            evidence="$(jq -r '.gitSha // "missing"' _incoming/summary.json)"
          fi
          echo "tag sha-$COMMIT_SHA | checkout $head | evidence $evidence"
          if [ "$head" != "$COMMIT_SHA" ]; then
            echo "::error::checkout $head != tag commit $COMMIT_SHA — refusing to publish"
            exit 1
          fi
          if [ "$evidence" != none ] && [ "$evidence" != "$COMMIT_SHA" ]; then
            echo "::error::summary commit $evidence != tag commit $COMMIT_SHA — refusing to publish"
            exit 1
          fi

      # The journey bundle must come from the same commit AND the same run as
      # the summary it sits beside (spec 20 R5).
      - name: Assert same-run journey evidence
        if: github.event_name == 'workflow_run'
        env:
          RID: ${{ github.event.workflow_run.id }}
        run: |
          f=_evidence_in/journey-evidence.json
          if [ ! -f "$f" ]; then
            echo "journey evidence none"
            exit 0
          fi
          sha="$(jq -r '.commitSha // "missing"' "$f")"
          run="$(jq -r '.runId // "missing"' "$f")"
          echo "journey evidence commit $sha | run $run (tag $COMMIT_SHA | run $RID)"
          if [ "$sha" != "$COMMIT_SHA" ] || [ "$run" != "$RID" ]; then
            echo "::error::journey evidence is from another commit or run — refusing to publish"
            exit 1
          fi

      # Whether this run publishes. Every ci / nightly / dispatch run does. A
      # walkthrough run does only when its recording is of THIS commit and
      # re-recorded the very ci run whose bundle the assets branch holds —
      # runs queue in completion order, not commit order, so an older
      # recording finishing late publishes nothing (and nothing else runs).
      - name: Decide whether to publish
        id: wt
        env:
          WF_NAME: ${{ github.event.workflow_run.name }}
        run: |
          if [ "$WF_NAME" != walkthrough ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          f=_walkthrough_in/walkthrough-evidence.json
          if [ ! -f "$f" ]; then
            echo "::notice::no walkthrough evidence in the triggering run — nothing to publish"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          sha="$(jq -r '.commitSha // "missing"' "$f")"
          gate="$(jq -r '.gatingRunId // "none"' "$f")"
          ci_run=none
          ci_sha=none
          if git ls-remote --exit-code --heads origin "$ASSETS_BRANCH" >/dev/null 2>&1; then
            git fetch --depth 1 origin "$ASSETS_BRANCH"
            ci="$(git show "origin/${ASSETS_BRANCH}:ci/journey-evidence.json" 2>/dev/null || echo '{}')"
            ci_run="$(jq -r '.runId // "none"' <<<"$ci")"
            ci_sha="$(jq -r '.commitSha // "none"' <<<"$ci")"
          fi
          echo "walkthrough commit $sha | gating run $gate | tag $COMMIT_SHA | assets ci run $ci_run @ $ci_sha"
          if [ "$sha" = "$COMMIT_SHA" ] && [ "$ci_sha" = "$COMMIT_SHA" ] && [ "$gate" = "$ci_run" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::walkthrough is not of the gated commit on the assets branch — not published"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      # Check out (or create) the rolling-history data branch as a worktree.
      - name: Prepare data branch
        if: steps.wt.outputs.publish == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin "$DATA_BRANCH" >/dev/null 2>&1; then
            git fetch origin "$DATA_BRANCH"
            git worktree add _data "origin/$DATA_BRANCH"
            git -C _data switch -c "$DATA_BRANCH" --track "origin/$DATA_BRANCH" 2>/dev/null || git -C _data switch "$DATA_BRANCH"
          else
            git worktree add --orphan -b "$DATA_BRANCH" _data
          fi
          mkdir -p _data/history

      # Append the new summary (named by its instant + run id) and prune the
      # window. Skipped on workflow_dispatch (no new run to ingest).
      - name: Ingest summary
        if: github.event_name == 'workflow_run' && github.event.workflow_run.name != 'walkthrough'
        env:
          RID: ${{ github.event.workflow_run.id }}
        run: |
          if [ ! -f _incoming/summary.json ]; then
            echo "::warning::no summary.json from the triggering run (skipped/queued nightly, or an expired artifact) — skipping ingest; the site still rebuilds from existing history"
            exit 0
          fi
          TS=$(date -u +%Y%m%dT%H%M%SZ)
          cp _incoming/summary.json "_data/history/${TS}-${RID}.json"
          # keep the newest HISTORY_KEEP files (names sort chronologically)
          mapfile -t old < <(find _data/history -maxdepth 1 -name '*.json' | sort | head -n "-${HISTORY_KEEP}")
          if [ "${#old[@]}" -gt 0 ]; then rm -f "${old[@]}"; fi
          git -C _data add history
          git -C _data commit -m "chore(pay-verify): ingest summary from run ${RID} [skip ci]" || echo "nothing to commit"
          git -C _data push origin "$DATA_BRANCH"

      # Replace the assets branch with this run's bundle: an orphan commit,
      # force-pushed, so the branch only ever holds the latest ci bundle. Over
      # the spec 20 media budget, nothing is pushed and the job fails.
      - name: Publish journey evidence to the assets branch
        if: github.event_name == 'workflow_run' && github.event.workflow_run.name == 'ci'
        env:
          RID: ${{ github.event.workflow_run.id }}
          WF_NAME: ${{ github.event.workflow_run.name }}
        run: |
          if [ ! -f _evidence_in/journey-evidence.json ]; then
            if [ "$WF_NAME" = ci ] && git ls-remote --exit-code --heads origin "$ASSETS_BRANCH" >/dev/null 2>&1; then
              # A ci run with no bundle (a failed download, or a re-run attempt)
              # must not leave the previous bundle in place: it carries the same
              # run id and commit, and would be shown as this attempt's (R5).
              echo "no journey evidence from this ci run — removing the previous bundle"
              git push origin --delete "$ASSETS_BRANCH"
            else
              echo "no journey evidence from this run — the assets branch is left as it is"
            fi
            exit 0
          fi
          bytes="$(du -sb _evidence_in | cut -f1)"
          if [ "$bytes" -gt $((100 * 1024 * 1024)) ]; then
            echo "::error::journey evidence is $bytes bytes, over the 100 MB budget"
            exit 1
          fi
          git worktree add --orphan -b _assets_new _assets_new
          mkdir -p _assets_new/ci
          cp -r _evidence_in/. _assets_new/ci/
          git -C _assets_new add ci
          git -C _assets_new commit -q -m "chore(pay-verify): journey evidence from run ${RID} @ ${COMMIT_SHA} [skip ci]"
          git -C _assets_new push --force origin "HEAD:refs/heads/${ASSETS_BRANCH}"

      # Add the recording beside the ci bundle it re-recorded: a new orphan
      # commit holding that ci/ unchanged plus walkthrough/, force-pushed. The
      # next ci publish replaces the branch with its own ci/ only, so a video
      # never outlives the gating run it belongs to.
      - name: Publish walkthrough to the assets branch
        if: github.event.workflow_run.name == 'walkthrough' && steps.wt.outputs.publish == 'true'
        env:
          RID: ${{ github.event.workflow_run.id }}
        run: |
          git worktree add --orphan -b _assets_wt _assets_wt
          git -C _assets_wt checkout "origin/${ASSETS_BRANCH}" -- ci
          mkdir -p _assets_wt/walkthrough
          # Only what the site serves: the evidence and the videos (the
          # pacing/ contact sheets are review aids, not dashboard media).
          cp _walkthrough_in/walkthrough-evidence.json _assets_wt/walkthrough/
          # Evidence without videos (none recorded) still publishes: every
          # card then simply has no Video tab.
          if [ -d _walkthrough_in/videos ]; then cp -r _walkthrough_in/videos _assets_wt/walkthrough/; fi
          bytes="$(du -sb _assets_wt --exclude=.git | cut -f1)"
          if [ "$bytes" -gt $((100 * 1024 * 1024)) ]; then
            echo "::error::journey media is $bytes bytes, over the 100 MB budget"
            exit 1
          fi
          git -C _assets_wt add ci walkthrough
          git -C _assets_wt commit -q -m "chore(pay-verify): walkthrough from run ${RID} @ ${COMMIT_SHA} [skip ci]"
          git -C _assets_wt push --force origin "HEAD:refs/heads/${ASSETS_BRANCH}"

      # The bundle the site shows: the assets branch as it now stands (this
      # run's, or the latest ci bundle on a nightly / dispatch rebuild). The
      # generator binds it to cards by run + commit, and validates every still.
      - name: Fetch journey evidence
        if: steps.wt.outputs.publish == 'true'
        run: |
          if git ls-remote --exit-code --heads origin "$ASSETS_BRANCH" >/dev/null 2>&1; then
            git fetch --depth 1 origin "$ASSETS_BRANCH"
            git worktree add --detach _assets FETCH_HEAD
          else
            echo "no ${ASSETS_BRANCH} branch yet — no journey evidence"
          fi

      # Generate the static site (to its own dir, kept apart from the compiled
      # JS in dist/). Fold in the latest run's Playwright report ONLY when it is
      # present, and only then link to it — no dead /report link otherwise.
      - name: Generate site
        if: steps.wt.outputs.publish == 'true'
        env:
          RUN_URL_BASE: ${{ github.server_url }}/${{ github.repository }}/actions/runs/
        run: |
          mkdir -p packages/verify-site/dist/site
          args=(--history _data/history --out packages/verify-site/dist/site)
          if [ -d _incoming/playwright-report ]; then
            cp -r _incoming/playwright-report packages/verify-site/dist/site/report
            args+=(--report-href report/)
          fi
          if [ -f _assets/ci/journey-evidence.json ]; then
            args+=(--evidence _assets/ci)
          fi
          if [ -f _assets/walkthrough/walkthrough-evidence.json ]; then
            args+=(--walkthrough _assets/walkthrough)
          fi
          args+=(--run-url-base "$RUN_URL_BASE")
          node packages/verify-site/dist/generate.js "${args[@]}"

      # Consecutive runs can finish out of order; only the image of main's
      # current tip moves :latest, so an older commit does not overwrite it.
      # (The stack pins by digest, so only :latest readers see a lost race.)
      - name: Check whether this commit is main's tip
        id: tip
        if: steps.wt.outputs.publish == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: "main",
            });
            const latest = data.commit.sha === process.env.COMMIT_SHA;
            core.info(`main tip ${data.commit.sha}; this commit ${process.env.COMMIT_SHA}; move latest: ${latest}`);
            core.setOutput("move_latest", String(latest));

      - uses: docker/setup-buildx-action@v3
        if: steps.wt.outputs.publish == 'true'

      - uses: docker/login-action@v4
        if: steps.wt.outputs.publish == 'true'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build and scan BEFORE pushing: a rejected image must never reach GHCR,
      # where pin-update would pick up its sha-* tag. pull: true re-resolves the
      # base tag each run, so a patched base is used as soon as it is published.
      # (The history branch is already pushed by now; a failed scan leaves the
      # previous image serving while the history moves on. That is intended.)
      - name: Build image (local, for the scan)
        if: steps.wt.outputs.publish == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: packages/verify-site/Dockerfile
          pull: true
          load: true
          push: false
          tags: payroll-app-verify:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Image vulnerability gate: fail on fixed CRITICAL findings (same posture
      # as the app image). nginx-unprivileged:alpine base, static content only.
      - name: Trivy image scan
        if: steps.wt.outputs.publish == 'true'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: payroll-app-verify:scan
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      # Push the exact image Trivy scanned (a rebuild could re-resolve the base
      # tag to a digest that was never scanned).
      # A walkthrough publish re-images the same commit with its video. It is
      # tagged sha-<commit>-walkthrough: the stack's pin-update follows the
      # newest sha-* tag, and re-pushing the same sha-<commit> tag would not
      # move its tag-only pin.
      - name: Push image
        if: steps.wt.outputs.publish == 'true'
        env:
          MOVE_LATEST: ${{ steps.tip.outputs.move_latest }}
          TAG: sha-${{ env.COMMIT_SHA }}${{ github.event.workflow_run.name == 'walkthrough' && '-walkthrough' || '' }}
        run: |
          docker tag payroll-app-verify:scan "$IMAGE:$TAG"
          docker push "$IMAGE:$TAG"
          if [ "$MOVE_LATEST" = "true" ]; then
            docker tag payroll-app-verify:scan "$IMAGE:latest"
            docker push "$IMAGE:latest"
          fi
