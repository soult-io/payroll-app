packages:
  - "apps/*"
  - "packages/*"

# Build scripts these deps need (esbuild binary download) — pnpm 11 blocks
# dependency build scripts by default.
onlyBuiltDependencies:
  - esbuild
# Optional deps of @better-auth/cli we never use (prisma/sqlite schema paths);
# their build scripts are not needed.
ignoredBuiltDependencies:
  - "@prisma/client"
  - better-sqlite3
