name: e2e-nightly

# Nightly e2e against live QA (spec 14 §3, amended 2026-08-19): the full
# Playwright suite runs against the QA deployment at the QA_E2E_BASE_URL repo
# SECRET (owner decision 2026-08-19: this is a public repo — a secret keeps the
# URL masked in CI logs and invisible to the API; the URL is an address, not a
# key, and the QA host is allowlist-scoped at NPM regardless) — real Postgres,
# pg-boss schedulers, Mailpit.
# Failures open (or comment on) a deduped GitHub issue.
#
# Fork-friendly: the e2e-qa job gates on `github.repository` (the job-level
# `if` context list does NOT include `secrets`, so the gate is the repo
# identity itself — forks never match `soult-io/payroll-app`). A fork's job is
# skipped BEFORE a runner is allocated — no self-hosted runner is ever
# requested — and the skip-notice job reports a clean green success instead.
#
# QA credentials/TOTP AND the QA export token are NOT secrets: they are the
# fixed, documented, fake values from the QA seed (docs/qa.md), hardcoded in
# e2e/tests/qa.ts. The ONE GitHub secret this repo holds is QA_E2E_BASE_URL.
#
# Runner (amendment 2026-08-06): QA is scoped behind a reverse-proxy access
# list (LAN/VPN only) — GitHub-hosted runners get 403, so this job runs on a
# repo-scoped self-hosted runner inside the QA network (label: qa-e2e), which
# is inside the allow list. If the runner is asleep at cron time the job
# QUEUES and runs when it wakes (24h queue window) — the nightly becomes
# "next time the runner is on", which is acceptable for e2e.
# Playwright system libraries are pre-installed on the runner host (one-time
# runbook step, docs/qa.md) — hence `playwright install chromium` WITHOUT
# --with-deps (which would need sudo on every run).

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  e2e-qa:
    # Skip before runner allocation when QA is not configured (forks) —
    # a skipped job counts as success and never touches the self-hosted pool.
    if: github.repository == 'soult-io/payroll-app'  # secrets. not allowed in job-level if; repo identity is the fork gate
    runs-on: [self-hosted, qa-e2e]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6
        with:
          version: 11.17.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Playwright chromium
        run: pnpm --filter @payroll/e2e exec playwright install chromium

      # E2E_BASE_URL disables the ephemeral boot; the suite targets live QA.
      # No build needed — Playwright runs the TS specs directly and nothing
      # imports app dists.
      - name: E2E against live QA
        env:
          E2E_BASE_URL: ${{ secrets.QA_E2E_BASE_URL }}
        run: pnpm --filter @payroll/e2e e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-qa-report
          path: e2e/playwright-report/
          retention-days: 14

      # Failure → GitHub issue, deduped on the 'e2e-nightly' label: comment on
      # the existing open issue instead of opening a duplicate. Scheduled runs
      # only — workflow_dispatch failures just fail the run.
      - name: Open or update failure issue
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v9
        env:
          QA_URL: ${{ secrets.QA_E2E_BASE_URL }}
        with:
          script: |
            const label = "e2e-nightly";
            const date = new Date().toISOString().slice(0, 10);
            const title = `Nightly e2e against QA failed ${date}`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `The nightly e2e suite against ${process.env.QA_URL} failed.`,
              ``,
              `- Run: ${runUrl}`,
              `- Commit: ${context.sha}`,
              `- Date: ${date}`,
              ``,
              `See the Playwright report artifact on the run for the failure summary.`,
            ].join("\n");

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: label,
              per_page: 10,
            });
            const existing = issues.find((i) => !i.pull_request);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Failed again: ${title}\n\n${body}`,
              });
              core.info(`commented on existing issue #${existing.number}`);
            } else {
              const { data: created } = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: [label],
              });
              core.info(`opened issue #${created.number}`);
            }

  skip-notice:
    # Forks: report a clean green skip.
    if: github.repository != 'soult-io/payroll-app'
    runs-on: ubuntu-latest
    steps:
      - name: Notice
        run: |
          echo "::notice::Not soult-io/payroll-app — skipping the nightly e2e against live QA. This is expected on forks and is not a failure."
