packages:
  - "apps/*"
  - "packages/*"

# Build scripts these deps need (esbuild binary download) — pnpm 11 blocks
# dependency build scripts by default.
onlyBuiltDependencies:
  - esbuild
# Optional deps of @better-auth/cli we never use (prisma/sqlite schema paths);
# their build scripts are not needed.
ignoredBuiltDependencies:
  - "@prisma/client"
  - better-sqlite3

# pnpm 11 format: explicit per-package build approval (the earlier failure
# came from an interactive `approve-builds` artifact with placeholder values).
allowBuilds:
  esbuild: true
  '@prisma/client': false
  better-sqlite3: false

# Force the deprecated @esbuild-kit/esm-loader chain (via drizzle-kit) off
# esbuild 0.18.20 — its Go binary carries CRITICAL stdlib CVEs (Trivy gate).
overrides:
  '@esbuild-kit/core-utils>esbuild': 0.28.1
  'drizzle-kit>esbuild': 0.28.1
