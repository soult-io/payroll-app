# payroll-app-verify — static server for the pay-verify QA dashboard.
# Unprivileged nginx listens on 8080 (non-root). Public exposure + TLS + the
# LAN/VPN access gate are the BCN NPM's job (chunk D); this server is reached by
# the proxy over the shared docker network. Serves index.html + the copied
# Playwright report/ — synthetic data only.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Regenerated on every run and served from a fresh, digest-pinned image per
    # deploy — the document must never be cached stale.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Playwright html report copied in at generate time; static assets, short
    # cache but never immutable (a new deploy reuses the same paths).
    location /report/ {
        add_header Cache-Control "public, max-age=300";
        try_files $uri $uri/ =404;
    }

    # Spec 20 journey stills, copied in at generate time and validated as
    # JPEGs there. Names are not content-addressed, so short cache, never
    # immutable; nosniff so a file is only ever served as what it claims.
    location /media/ {
        add_header Cache-Control "public, max-age=300";
        add_header X-Content-Type-Options "nosniff";
        try_files $uri =404;
    }

    # Single static page (not a client-routed SPA): an unknown path is genuinely
    # not found, so 404 it rather than serving the dashboard with a 200.
    location / {
        try_files $uri $uri/ =404;
    }
}
