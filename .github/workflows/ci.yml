name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint + format (biome)
        run: pnpm lint

      # Build BEFORE typecheck: cross-package imports resolve to dist/*.d.ts,
      # which must exist first (locally, stale dist dirs mask this).
      - name: Build web + server + packages
        run: pnpm -r run build

      - name: Typecheck (all packages)
        run: pnpm -r run typecheck

      - name: Engine unit tests + coverage (regression oracle — spec 2)
        run: pnpm --filter @payroll/engine exec vitest run --coverage

      - name: Server integration tests + coverage (PGlite — spec 2/3/4/6)
        run: pnpm --filter @payroll/server exec vitest run --coverage

      - name: Build container image
        run: docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }} .

  # Browser E2E (hardening B): real SPA + Fastify on PGlite, Playwright
  # chromium. Runs in parallel with verify; push-image waits for both.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build web + packages (SPA dist + workspace dists)
        run: pnpm -r run build

      - name: Install Playwright chromium
        run: pnpm --filter @payroll/e2e exec playwright install --with-deps chromium

      - name: E2E (Playwright journeys)
        run: pnpm --filter @payroll/e2e e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

  push-image:
    # Image is pushed only from main (spec 8/13). This repo is artifact-only:
    # CI publishes sha-<full-sha> + latest tags and nothing here touches any
    # deployment — prod moves via release.yml + a pin PR in the stack repo.
    # E2E gates the push: the image carries exactly what the journeys exercise.
    needs: [verify, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      packages: write
      security-events: write   # Trivy SARIF upload to code scanning
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Image vulnerability gate: fail on CRITICAL (fixed) findings, table output
      # to the job log. SARIF upload to code scanning only works when GitHub
      # Advanced Security is available (public repos or GHAS) — gated below.
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Trivy image scan (SARIF for code scanning)
        if: github.event.repository.visibility == 'public'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "0"
          format: sarif
          output: trivy-results.sarif

      - name: Upload Trivy SARIF
        if: github.event.repository.visibility == 'public'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
