name: pay-verify-site

# Spec 17 chunk B (PAY-44): build + publish the static pay-verify QA dashboard
# image ghcr.io/soult-io/payroll-app-verify from the verify-summary history.
#
# It never runs tests. It ingests the summary.json that ci.yml / e2e-nightly.yml
# already publish (chunk A), keeps a rolling window of them on the orphan
# `pay-verify-data` branch, generates the static site from that history, and
# builds a digest-pinned nginx image. Deploy + the LAN/VPN gate are chunk D.
#
# Triggers: after ci (on main) or the nightly finishes (workflow_run), plus a
# manual re-generate (workflow_dispatch, no new ingest). Fork-gated on the repo.
#
# Same-commit publishing (spec 20, PAY-78). Under workflow_run, github.sha is
# main's tip when THIS run starts, not the commit the triggering run tested. So
# the checkout, the image tag and the ingested summary are all bound to
# workflow_run.head_sha (COMMIT_SHA), re-checked against the API, and asserted
# equal before anything is pushed. :latest moves only while that commit is
# still main's tip. Unlike ta-verify, a FAILED triggering run still publishes:
# showing failures is this dashboard's job.
#
# Gotcha: `gh run list` shows main's tip as headSha for workflow_run runs. The
# "tag sha-X | checkout X | evidence X" log line is the record of the real
# bound commit.

on:
  workflow_run:
    workflows: [ci, e2e-nightly]
    types: [completed]
  workflow_dispatch:

# Jobs grant their own permissions; nothing is inherited.
permissions: {}

# Serialize: concurrent runs would race on the pay-verify-data branch push.
concurrency:
  group: pay-verify-site
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/soult-io/payroll-app-verify
  DATA_BRANCH: pay-verify-data
  HISTORY_KEEP: "60"
  # The commit this run builds from: the triggering run's tested commit, else
  # the dispatched ref's own commit.
  COMMIT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  build:
    # Only the real repo, and (for workflow_run) only runs of this repo's main
    # from a push, the nightly cron or a manual dispatch. A pull_request run
    # never feeds the site, including a fork PR from a branch named "main"
    # (head_branch alone matches that). workflow_dispatch always allowed.
    # Keep in step with the API re-check in "Resolve triggering run".
    if: >-
      github.repository == 'soult-io/payroll-app' &&
      (github.event_name == 'workflow_dispatch' || (
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event.workflow_run.event)
      ))
    runs-on: ubuntu-latest
    permissions:
      contents: write # push to the pay-verify-data branch
      packages: write # push the image to GHCR
      actions: read # download the triggering run's artifact
    steps:
      # Re-read the triggering run from the API and confirm everything the
      # publish relies on, including the attempt (a re-run started since would
      # swap in its artifacts). Loud: nothing publishes rather than the wrong
      # commit's evidence.
      - name: Resolve triggering run
        if: github.event_name == 'workflow_run'
        uses: actions/github-script@v7
        with:
          script: |
            const t = context.payload.workflow_run;
            const { data: run } = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: t.id,
            });
            const workflows = [".github/workflows/ci.yml", ".github/workflows/e2e-nightly.yml"];
            const problems = [
              !workflows.some((w) => run.path.startsWith(w)) && `path ${run.path}`,
              !["push", "schedule", "workflow_dispatch"].includes(run.event) && `event ${run.event}`,
              run.head_branch !== "main" && `head_branch ${run.head_branch}`,
              run.head_repository?.full_name !== `${context.repo.owner}/${context.repo.repo}` &&
                `head_repository ${run.head_repository?.full_name}`,
              run.head_sha !== process.env.COMMIT_SHA && `head_sha ${run.head_sha} != ${process.env.COMMIT_SHA}`,
              run.run_attempt !== t.run_attempt && `run_attempt ${run.run_attempt} != ${t.run_attempt}`,
            ].filter(Boolean);
            if (problems.length) {
              core.setFailed(`run ${t.id} is not usable evidence: ${problems.join("; ")}`);
              return;
            }
            core.info(`bound to ${run.path} run ${run.id} attempt ${run.run_attempt} @ ${run.head_sha}`);

      # The tested commit: the generator, Dockerfile and nginx.conf come from it.
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.COMMIT_SHA }}

      - uses: pnpm/action-setup@v6
        with:
          version: 11.17.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build verify-site (+ its schema dep)
        run: pnpm --filter @payroll/verify-summary --filter @payroll/verify-site run build

      # Pull the summary + html report the triggering run published (chunk A).
      # ci → pay-verify-summary; nightly → pay-verify-summary-nightly.
      - name: Download summary artifact
        if: github.event_name == 'workflow_run'
        # Tolerate a missing artifact: a skipped/queued nightly (self-hosted
        # qa-e2e runner asleep) or an expired artifact legitimately has none.
        # The Ingest step warns and rebuilds the site from existing history.
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: ${{ github.event.workflow_run.name == 'e2e-nightly' && 'pay-verify-summary-nightly' || 'pay-verify-summary' }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: _incoming

      # Last gate before any push: the tag commit, the checked-out tree and the
      # ingested summary's commit must all be the same. A missing summary (the
      # tolerated skipped/expired case above) ingests nothing, so there is no
      # evidence leg to check and it logs "evidence none".
      - name: Assert same-commit evidence
        run: |
          head="$(git rev-parse HEAD)"
          evidence=none
          if [ -f _incoming/summary.json ]; then
            evidence="$(jq -r '.gitSha // "missing"' _incoming/summary.json)"
          fi
          echo "tag sha-$COMMIT_SHA | checkout $head | evidence $evidence"
          if [ "$head" != "$COMMIT_SHA" ]; then
            echo "::error::checkout $head != tag commit $COMMIT_SHA — refusing to publish"
            exit 1
          fi
          if [ "$evidence" != none ] && [ "$evidence" != "$COMMIT_SHA" ]; then
            echo "::error::summary commit $evidence != tag commit $COMMIT_SHA — refusing to publish"
            exit 1
          fi

      # Check out (or create) the rolling-history data branch as a worktree.
      - name: Prepare data branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin "$DATA_BRANCH" >/dev/null 2>&1; then
            git fetch origin "$DATA_BRANCH"
            git worktree add _data "origin/$DATA_BRANCH"
            git -C _data switch -c "$DATA_BRANCH" --track "origin/$DATA_BRANCH" 2>/dev/null || git -C _data switch "$DATA_BRANCH"
          else
            git worktree add --orphan -b "$DATA_BRANCH" _data
          fi
          mkdir -p _data/history

      # Append the new summary (named by its instant + run id) and prune the
      # window. Skipped on workflow_dispatch (no new run to ingest).
      - name: Ingest summary
        if: github.event_name == 'workflow_run'
        env:
          RID: ${{ github.event.workflow_run.id }}
        run: |
          if [ ! -f _incoming/summary.json ]; then
            echo "::warning::no summary.json from the triggering run (skipped/queued nightly, or an expired artifact) — skipping ingest; the site still rebuilds from existing history"
            exit 0
          fi
          TS=$(date -u +%Y%m%dT%H%M%SZ)
          cp _incoming/summary.json "_data/history/${TS}-${RID}.json"
          # keep the newest HISTORY_KEEP files (names sort chronologically)
          mapfile -t old < <(find _data/history -maxdepth 1 -name '*.json' | sort | head -n "-${HISTORY_KEEP}")
          if [ "${#old[@]}" -gt 0 ]; then rm -f "${old[@]}"; fi
          git -C _data add history
          git -C _data commit -m "chore(pay-verify): ingest summary from run ${RID} [skip ci]" || echo "nothing to commit"
          git -C _data push origin "$DATA_BRANCH"

      # Generate the static site (to its own dir, kept apart from the compiled
      # JS in dist/). Fold in the latest run's Playwright report ONLY when it is
      # present, and only then link to it — no dead /report link otherwise.
      - name: Generate site
        run: |
          mkdir -p packages/verify-site/dist/site
          args=(--history _data/history --out packages/verify-site/dist/site)
          if [ -d _incoming/playwright-report ]; then
            cp -r _incoming/playwright-report packages/verify-site/dist/site/report
            args+=(--report-href report/)
          fi
          node packages/verify-site/dist/generate.js "${args[@]}"

      # Consecutive runs can finish out of order; only the image of main's
      # current tip moves :latest, so an older commit does not overwrite it.
      # (The stack pins by digest, so only :latest readers see a lost race.)
      - name: Check whether this commit is main's tip
        id: tip
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: "main",
            });
            const latest = data.commit.sha === process.env.COMMIT_SHA;
            core.info(`main tip ${data.commit.sha}; this commit ${process.env.COMMIT_SHA}; move latest: ${latest}`);
            core.setOutput("move_latest", String(latest));

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: packages/verify-site/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:sha-${{ env.COMMIT_SHA }}
            ${{ steps.tip.outputs.move_latest == 'true' && format('{0}:latest', env.IMAGE) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Image vulnerability gate: fail on fixed CRITICAL findings (same posture
      # as the app image). nginx-unprivileged:alpine base, static content only.
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:sha-${{ env.COMMIT_SHA }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
