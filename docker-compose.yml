# Self-contained deployment per plan/specs/deployment.md (spec 8).
# Worst-case footprint ≈ 1 GB (app 512m + migrate 512m one-shot + db 512m).
#
# Deploy flow (Portainer GitOps, the NUC): CI rewrites the image tag; Portainer
# polls this repo and redeploys. Secrets live in $SECRETS_HOST_DIR (default
# /srv/payroll/secrets) on the host, mounted read-only — never env values.
# Deploy flow (anyone else): clone, set SECRETS_HOST_DIR (or place files at the
# default), cp .env.example .env, docker compose up -d.

name: payroll

services:
  app:
    container_name: payroll-app
    image: ghcr.io/soult-io/payroll-app:sha-97e25748fe647adf08daeebfa367451550b235cb
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 8927
      SECRETS_DIR: /run/secrets
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: payroll
      DB_USER: payroll
      # Public URL behind the NPM proxy (spec 8). Set in .env on the host.
      BASE_URL: ${BASE_URL:-http://localhost:8927}
      # SMTP_HOST / SMTP_PORT / SMTP_USER / SMTP_FROM come from .env (spec 8:
      # nothing hardcoded to personal infrastructure).
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
    networks:
      - default
      - mcp_network  # NPM proxy (payroll.stabpablo.eu) resolves this container by name
    ports:
      # Loopback-only; NPM proxies the public hostname with TLS + HSTS.
      # One port everywhere (owner 2026-07-29): 8927 is the app's listen port,
      # the host bind, and the NPM upstream (payroll-app:8927 over mcp_network).
      # 8927 = next free in the fleet 89xx loopback registry; 8989 is sonarr's.
      - "127.0.0.1:8927:8927"
    depends_on:
      db:
        condition: service_healthy
      app-migrate:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "1.0"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8927/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    secrets:
      - db-password
      - smtp-password
      - encryption-key
      - session-secret
      - export-token

  app-migrate:
    container_name: payroll-app-migrate
    image: ghcr.io/soult-io/payroll-app:sha-97e25748fe647adf08daeebfa367451550b235cb
    build:
      context: .
      dockerfile: Dockerfile
    # One-shot: drizzle-kit migrate, then exits (seeds run once by hand per
    # docs/cutover.md). The app service gates boot on this completing successfully.
    command:
      - sh
      - -c
      - |
        set -eu
        if [ ! -r /run/secrets/db-password ]; then
          echo "FATAL: /run/secrets/db-password is not readable by the payroll user (uid 10001)." >&2
          echo "Host fix: chown 10001:10001 /srv/payroll/secrets/* (compose bind-mounts preserve host ownership)." >&2
          exit 1
        fi
        export DB_PASSWORD=$$(cat /run/secrets/db-password)
        export DATABASE_URL="postgres://$${DB_USER}:$${DB_PASSWORD}@$${DB_HOST}:$${DB_PORT}/$${DB_NAME}"
        cd /app/db && ./node_modules/.bin/drizzle-kit migrate --config drizzle.config.ts
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: payroll
      DB_USER: payroll
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "1.0"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    secrets:
      - db-password

  db:
    container_name: payroll-db
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: payroll
      POSTGRES_USER: payroll
      POSTGRES_PASSWORD_FILE: /run/secrets/db-password
    volumes:
      - pgdata:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "1.0"
    security_opt:
      - no-new-privileges:true
    # NO cap_drop here: the postgres image entrypoint starts as root and must
    # chown/chmod /var/lib/postgresql/data + setuid down to the postgres user —
    # cap_drop ALL strips CHOWN/SETUID/SETGID and initdb dies (fleet convention:
    # synapse-db runs the same way). app/app-migrate keep their cap_drop.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payroll -d payroll"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    secrets:
      - db-password

volumes:
  pgdata:

networks:
  mcp_network:
    external: true  # shared fleet network; NPM resolves containers by name here

secrets:
  db-password:
    file: ${SECRETS_HOST_DIR:-/srv/payroll/secrets}/db-password
  smtp-password:
    file: ${SECRETS_HOST_DIR:-/srv/payroll/secrets}/smtp-password
  encryption-key:
    file: ${SECRETS_HOST_DIR:-/srv/payroll/secrets}/encryption-key
  session-secret:
    file: ${SECRETS_HOST_DIR:-/srv/payroll/secrets}/session-secret
  # Optional: read-only export API (docs/export-api.md). Compose requires the
  # file to exist to deploy — create it (0600, 10001:10001) or comment this
  # entry + the app service reference out; the endpoint 503s when absent.
  export-token:
    file: ${SECRETS_HOST_DIR:-/srv/payroll/secrets}/export-token
